<form id="account-form">
  <h2>Create Account</h2>
  <input type="radio" id="saving" name="account-type" value="saving">
  <label for="saving">Saving Account</label>

<input type="radio" id="checking" name="account-type" value="checking">
  <label for="checking">Checking Account</label>

<input type="radio" id="ira" name="account-type" value="ira">
  <label for="ira">IRA Account</label>

<input type="radio" id="money-market" name="account-type" value="money-market">
  <label for="money-market">Money Market Account</label>

<input type="radio" id="business-loan" name="account-type" value="business-loan">
  <label for="business-loan">Business Loan</label>

<input type="radio" id="personal-loan" name="account-type" value="personal-loan">
  <label for="personal-loan">Personal Loan</label>

<button type="submit">Submit</button>
</form>
